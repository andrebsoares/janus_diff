name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # Publishing from electron-builder makes each target create the release,
      # and the loser of that race fails the build; so it only builds.
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Publish the release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.blockmap dist/latest.yml --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
